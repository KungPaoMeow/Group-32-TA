{% extends 'base.html' %}

{% block title %} Test Page Title {% endblock %}

{% block content %}
<style>
    .content {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin: 40px;
        box-sizing: border-box;
        width: calc(100% - 80px);
    }
</style>
<div class="content">
    <h1>Edit Drug Information</h1>
    <form method="POST">
        <label for="name">Product Name:</label>
        <input type="text" id="name" name="name" value="{{ drug.name }}"><br>

        <label for="company">Company:</label>
        <input type="text" id="company" name="company" value="{{ drug.company }}"><br>

        <label for="type">Type:</label>
        <select id="type" name="type">
            <option value="Prescription" {% if drug.type == 'Prescription' %}selected{% endif %}>Prescription</option>
            <option value="Over the Counter" {% if drug.type == 'Over the Counter' %}selected{% endif %}>Over the Counter</option>
        </select><br>

        <label for="description">Description:</label>
        <textarea name="description" id="">{{ drug.description }}</textarea>

        <label for="stock">Stock:</label>
        <input type="number" id="stock" name="stock" value="{{ drug.stock }}"><br>

        <input type="submit" value="Update">
    </form>
</div>
{% endblock %}

{% block styles %}
    <style>
        p {
            color: white;
        }
    </style>
{% endblock %}
