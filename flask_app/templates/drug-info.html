{% extends 'base.html' %}

{% block title %} Drug Information {% endblock %}

<!-- Inside of <main> -->
{% block content %}
    <header>
        <h1>Drug Information</h1>
        <div id="management-row">
            <input type="text" name="" id="search-box" placeholder="Search drug by name here">
            <a href="/new-drug?from=info"><button>+ New Drug</button></a>
        </div>

    </header>

    <section id="info-section">
        {% for drug in drugs %}
            <details class="drug" data-name="{{ drug.name }}">
                <summary>
                    {{ drug.name }}
                    <div>
                        <a href="/drug-edit/{{ drugs.index(drug) }}?from=info"><button>Edit</button></a>
                        <span class="triangle"></span>
                    </div>
                </summary>
                <p>{{ drug.description }}</p>
            </details>
        {% endfor %}
    </section> 
    
    <script>
        document.getElementById('search-box').addEventListener('input', function() {
            const filter = this.value.toLowerCase();
            const drugItems = document.querySelectorAll('.drug');

            drugItems.forEach((item) => {
                const drugName = item.getAttribute('data-name').toLowerCase();
                if (drugName.includes(filter)) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        });

    </script>
{% endblock %}

{% block styles %}
    <style>
        #info-section {
            margin-top: 5vh;
            padding: 0 5vw;
        }

        summary {
            display: flex;
            justify-content: space-between;
            list-style: none;
            cursor: pointer;
        }

        /* Custom triangle icon - span is 0 width and height by default */
        .triangle {
            display: inline-block;
            margin-top: 10px;
            border-left: 9px solid transparent;
            border-right: 9px solid transparent;
            border-top: 9px solid #000;
        }


        details {
            margin-bottom: 2vh;
            padding: 1vh 1vw;
            border: 1px solid #ccc;
            border-radius: 15px;
            background-color: #D9D9D9;
        }

        details[open] {
            background-color: #F9F9F9;
        }

        /* Rotate when open */
        details[open] .triangle {
            transform: rotate(180deg); 
        }

        main button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #1E88E5;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            cursor: pointer;
        }
        
    </style>
{% endblock %}
