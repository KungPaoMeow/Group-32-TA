{% extends 'base.html' %}

{% block title %} Test Page Title {% endblock %}

{% block content %}
<style>
    .content {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin: 40px;
        box-sizing: border-box;
        width: calc(100% - 80px);
    }
</style>
<div class="content">
    <h1>Delete Drug</h1>
    <p>Are you sure you would like to delete the drug: {{ drug.name }}?</p>
    <form method="POST">
        <input type="submit" name="delete" value="Yes"></input>
        <input type="submit" name="delete" value="No"></input>
    </form>
</div>
{% endblock %}

{% block styles %}
    <style>
        p {
            color: white;
        }
    </style>
{% endblock %}
